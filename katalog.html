<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#006948">
  <title>Katalog Produk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header class="cat-head">
    <div class="row" style="gap:.7rem">
      <div class="logo"><span class="ms">storefront</span></div>
      <div class="grow"><h1 id="cat-nama">Katalog Produk</h1></div>
    </div>
    <p id="cat-desc"></p>
  </header>
  <div class="cat-wrap">
    <div class="search"><span class="ms">search</span><input id="cat-q" placeholder="Cari produk..."></div>
    <div class="chips scroll" id="cat-chips" style="margin-top:.7rem"></div>
    <div class="grid" id="cat-grid" style="margin-top:.9rem"></div>
    <p class="fine" style="margin-top:1.5rem">Katalog ini dibuat dengan ArthaUMKM.</p>
  </div>
</div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script src="js/katalog.js"></script>
</body>
</html>
