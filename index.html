<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#006948">
  <title>ArthaUMKM — Keuangan Otomatis UMKM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- ============ LOGIN ============ -->
  <section id="screen-login" class="screen" hidden>
    <div class="login-wrap">
      <div class="brand-mark"><span class="ms">account_balance_wallet</span></div>
      <h1 class="login-title">ArthaUMKM</h1>
      <p class="login-sub">Catat keuangan usaha, kelola stok, dan promosikan produk — semua otomatis.</p>
      <form id="login-form" class="card login-card" autocomplete="on">
        <label class="field-label" for="login-email">Email</label>
        <div class="input"><span class="ms">mail</span><input id="login-email" type="email" inputmode="email" autocomplete="username" placeholder="nama@email.com" required></div>
        <label class="field-label" for="login-pin">PIN</label>
        <div class="input"><span class="ms">lock</span><input id="login-pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN 4–8 angka" required></div>
        <button class="btn btn-primary btn-block" type="submit" id="login-btn">Masuk</button>
      </form>
      <a class="link-catalog" href="katalog.html"><span class="ms">storefront</span> Lihat Katalog Produk</a>
    </div>
  </section>

  <!-- ============ SHELL ============ -->
  <div id="shell" hidden>
    <header class="topbar">
      <div class="logo"><span class="ms">account_balance_wallet</span></div>
      <div class="topbar-title"><b>ArthaUMKM</b><small id="topbar-sub">Beranda</small></div>
      <span class="badge" id="role-badge">Pemilik</span>
      <button class="avatar" id="avatar-btn" aria-label="Menu akun"></button>
    </header>

    <main id="views">
      <section id="view-beranda" class="view"></section>
      <section id="view-catat" class="view"></section>
      <section id="view-produk" class="view"></section>
      <section id="view-laporan" class="view"></section>
      <section id="view-transaksi" class="view"></section>
    </main>

    <nav class="bottom-nav" id="bottom-nav">
      <button data-nav="beranda"><span class="ms">dashboard</span><small>Beranda</small></button>
      <button class="nav-spacer" data-nav="catat" aria-label="Catat transaksi"><span class="fab"><span class="ms">add</span></span><small>Catat</small></button>
      <button data-nav="produk"><span class="ms">inventory_2</span><small>Produk</small></button>
      <button data-nav="laporan"><span class="ms">description</span><small>Laporan</small></button>
    </nav>
  </div>

  <div id="sheet-root"></div>
  <div id="notif" class="notif" role="status"></div>
  <div id="loading" class="loading" hidden><div class="spinner"></div></div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script src="js/app.js"></script>
</body>
</html>
